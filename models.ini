version = 1

# 全モデル共通の設定。各セクションで上書きできる。
[*]
ctx-size = 8192
parallel = 1
threads = 8
n-gpu-layers = auto
jinja = true
no-mmproj = true
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

# dense 27B。12 GB VRAM には全層載らず、約 39/65 層が GPU(生成 約 6 tok/s)。
[unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M]

# MoE 35B(アクティブ 3B)。エキスパートを CPU に置き、残りを GPU に。
[unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M]
cpu-moe = true

# dense 8B。VRAM に完全に収まる比較用(約 5 GB)。初回選択時にダウンロードされる。
[unsloth/Qwen3-8B-GGUF:Q4_K_M]

# Phase 3(RAG)の埋め込みモデル。embeddings = true で /v1/embeddings 専用、pooling = last は
# Qwen3-Embedding の推奨(最終トークンの隠れ状態を使う)。
# hf-repo は必須: キャッシュに無いモデルはルーターが hf-repo を自動で付けないため、
# これが無いと子プロセスがモデル無しで起動して永遠に loading のままになる。初回に約 640 MB を取得する。
[Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0]
hf-repo = Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
embeddings = true
pooling = last
ctx-size = 4096

version = 1

# 全モデル共通の設定。各セクションで上書きできる。
[*]
ctx-size = 8192
parallel = 1
threads = 8
n-gpu-layers = auto
jinja = true
no-mmproj = true
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

# dense 27B。12 GB VRAM には全層載らず、約 39/65 層が GPU(生成 約 6 tok/s)。
[unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M]

# MoE 35B(アクティブ 3B)。エキスパートを CPU に置き、残りを GPU に。
[unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M]
cpu-moe = true

# dense 8B。VRAM に完全に収まる比較用(約 5 GB)。初回選択時にダウンロードされる。
[unsloth/Qwen3-8B-GGUF:Q4_K_M]

# ---- Phase 5(LoRA)。追記のみ。既存セクションは変更しない ----

# 素の Qwen3-4B(LoRA との比較用)。初回選択時にダウンロードされる(約 2.5 GB)。
# 未ダウンロードのモデルはセクション名だけでは「既存モデル」と見なされず子プロセスが起動に失敗するので hf-repo を明示する。
[unsloth/Qwen3-4B-GGUF:Q4_K_M]
hf-repo = unsloth/Qwen3-4B-GGUF:Q4_K_M

# Qwen3-4B に docs/ と ai_harness の Q&A で QLoRA したもの(training/export_gguf.sh の出力)。
# セクション名が既存モデルに一致しないので model = で GGUF の絶対パスを指定する(llama-server README「Using multiple models」)。
[local/qwen3-4b-localllm-lora]
model = C:\dev\local_llm\models\qwen3-4b-localllm-lora-Q4_K_M.gguf

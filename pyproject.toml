[project]
name = "local-llm"
version = "0.1.0"
description = "llama.cpp(llama-server)で動かすローカル LLM の学習・ポートフォリオ用プロジェクト"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
llm-chat = "local_llm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

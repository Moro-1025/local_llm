[project]
name = "local-llm"
version = "0.1.0"
description = "llama.cpp(llama-server)で動かすローカル LLM の学習・ポートフォリオ用プロジェクト"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.5.4",
]

[project.scripts]
llm-chat = "local_llm.cli:main"
llm-web = "local_llm.web.app:main"
llm-index = "local_llm.rag.indexer:main"
llm-agent = "local_llm.agent.runner:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # starlette が httpx2 を推奨する警告。respx が httpx 1 系なので当面は httpx で続ける
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

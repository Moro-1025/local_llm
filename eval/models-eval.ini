# Phase 6 の評価用プリセット(models.ini の上書き版)。
# 違いは 1 行だけ: [unsloth/Qwen3-8B-GGUF:Q4_K_M] に hf-repo を明示する。
# 理由: この行が無いと、ルーターは 8B の子プロセスにモデルを渡さず、子がそれ自身ルーターとして起動して
#       永遠に loading のままになる(Phase 5 の 4B と同じ現象)。8B は Phase 6 の採点モデルなので必要。
# models.ini は Phase 6 契約の scope.write に無いため本体は変えていない。
# 本体へ同じ 1 行を入れたら(Completion Report の Amendment 案 1)このファイルは削除してよい。
#   .\scripts\start-server.ps1 -Port 8082 -Preset .\eval\models-eval.ini

version = 1

# 全モデル共通の設定。各セクションで上書きできる。
[*]
ctx-size = 8192
parallel = 1
threads = 8
n-gpu-layers = auto
jinja = true
no-mmproj = true
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

# dense 27B。12 GB VRAM には全層載らず、約 39/65 層が GPU(生成 約 6 tok/s)。
[unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M]

# MoE 35B(アクティブ 3B)。エキスパートを CPU に置き、残りを GPU に。
[unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M]
cpu-moe = true

# dense 8B。VRAM に完全に収まる比較用(約 5 GB)。初回選択時にダウンロードされる。
[unsloth/Qwen3-8B-GGUF:Q4_K_M]
hf-repo = unsloth/Qwen3-8B-GGUF:Q4_K_M

# Phase 3(RAG)の埋め込みモデル。embeddings = true で /v1/embeddings 専用、pooling = last は
# Qwen3-Embedding の推奨(最終トークンの隠れ状態を使う)。
# hf-repo は必須: キャッシュに無いモデルはルーターが hf-repo を自動で付けないため、
# これが無いと子プロセスがモデル無しで起動して永遠に loading のままになる。初回に約 640 MB を取得する。
[Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0]
hf-repo = Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
embeddings = true
pooling = last
ctx-size = 4096

# ---- Phase 5(LoRA)。追記のみ。既存セクションは変更しない ----

# 素の Qwen3-4B(LoRA との比較用)。初回選択時にダウンロードされる(約 2.5 GB)。
# 未ダウンロードのモデルはセクション名だけでは「既存モデル」と見なされず子プロセスが起動に失敗するので hf-repo を明示する。
[unsloth/Qwen3-4B-GGUF:Q4_K_M]
hf-repo = unsloth/Qwen3-4B-GGUF:Q4_K_M

# Qwen3-4B に docs/ と ai_harness の Q&A で QLoRA したもの(training/export_gguf.sh の出力)。
# セクション名が既存モデルに一致しないので model = で GGUF の絶対パスを指定する(llama-server README「Using multiple models」)。
[local/qwen3-4b-localllm-lora]
model = C:\dev\local_llm\models\qwen3-4b-localllm-lora-Q4_K_M.gguf

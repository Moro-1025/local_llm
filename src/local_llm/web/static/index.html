<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>local_llm chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- 左: 会話一覧 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="brand">local_llm</span>
        <button id="new-chat" class="btn primary" title="新しい会話">+ 新規</button>
      </div>
      <ul id="conversation-list" class="conversation-list"></ul>
      <div class="sidebar-footer">
        <span id="health" class="health unknown">llama-server: 確認中…</span>
      </div>
    </aside>

    <!-- 右: チャット欄 -->
    <main id="chat">
      <header class="toolbar">
        <label class="field">
          <span>モデル</span>
          <select id="model-select"></select>
        </label>
        <label class="field toggle">
          <input type="checkbox" id="thinking-toggle" checked>
          <span>thinking</span>
        </label>
        <label class="field toggle" title="data/corpus の資料を検索して回答の根拠にする">
          <input type="checkbox" id="rag-toggle">
          <span>RAG</span>
        </label>
        <span id="rag-status" class="rag-status"></span>
        <span id="conversation-title" class="title"></span>
      </header>

      <div id="banner" class="banner hidden"></div>

      <section id="messages" class="messages">
        <div class="empty-state" id="empty-state">
          <p>左の「+ 新規」か、下の入力欄から会話を始めてください。</p>
          <p class="hint">Enter で送信、Shift+Enter で改行</p>
        </div>
      </section>

      <footer class="composer">
        <textarea id="input" rows="1" placeholder="メッセージを入力…"></textarea>
        <button id="send" class="btn primary">送信</button>
      </footer>
    </main>
  </div>

  <template id="message-template">
    <article class="message">
      <div class="role"></div>
      <details class="thinking hidden">
        <summary>thinking</summary>
        <pre class="thinking-text"></pre>
      </details>
      <div class="content"></div>
      <ol class="sources hidden"></ol>
      <div class="meta"></div>
    </article>
  </template>

  <!-- Markdown 表示用(CDN ライブラリはこれ 1 つ) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
